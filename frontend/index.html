<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RoadGuard AI - Safe Navigation</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Login Screen -->
    <section id="loginScreen" class="login-container glassy">
        <div class="login-box">
            <h1>RoadGuard <span>AI</span></h1>
            <p>Prioritizing life over speed.</p>
            <br>
            <form id="loginForm">
                <div class="input-group">
                    <label for="phoneNumber">Phone Number</label>
                    <input type="tel" id="phoneNumber" placeholder="Enter your phone number" required>
                </div>
                <button type="submit" class="primary-btn" id="loginBtn">Login</button>
                <div style="text-align: center; margin: 10px 0; color: var(--text-secondary);">OR</div>
                <button type="button" class="secondary-btn" id="useLiveLocationLoginBtn">Use Live Location</button>
            </form>
            <p id="loginMsg" class="msg"></p>
        </div>
    </section>

    <!-- Main App Container -->
    <div id="mainApp" class="hidden">
        
        <!-- Full Screen Map -->
        <div id="map"></div>

        <!-- Floating Top Search Bar -->
        <div class="top-search-panel glassy">
            <header class="app-header-mini">
                <h1>RoadGuard <span>AI</span></h1>
            </header>
            <form id="routeForm" class="floating-form">
                <div class="search-inputs">
                    <div class="input-group">
                        <div class="input-with-btn">
                            <input type="text" id="start" placeholder="Start Location (e.g., Mumbai)" required>
                            <button type="button" id="btnUseCurrentLoc" class="icon-btn" title="Use Current Location">⌖</button>
                        </div>
                    </div>
                    <div class="input-group">
                        <input type="text" id="destination" placeholder="Destination (e.g., Pune)" required>
                    </div>
                </div>
                
                <div class="filters-row">
                    <input type="text" id="targetRegion" placeholder="Target city/state (e.g., Mumbai, Maharashtra)">
                    <select id="mode">
                        <option value="Car">Car</option>
                        <option value="Bike">Bike</option>
                        <option value="Bus">Bus</option>
                        <option value="Walk">Walk</option>
                    </select>
                    <select id="time">
                        <option value="Day">Day</option>
                        <option value="Night">Night</option>
                    </select>
                    <select id="weather">
                        <option value="Sunny">Sunny</option>
                        <option value="Rainy">Rainy</option>
                    </select>
                    <select id="traffic">
                        <option value="Low">Low</option>
                        <option value="Medium">Medium</option>
                        <option value="High">High</option>
                    </select>
                    <button type="submit" class="primary-btn search-btn">Search</button>
                </div>
            </form>
        </div>

        <!-- Selected Route Info Bar -->
        <div id="topRouteInfo" class="top-route-info glassy hidden">
            <!-- Populated via JS: "16 km • 32 mins • Moderate Risk" -->
        </div>

        <!-- Floating Bottom Results -->
        <div class="bottom-results-panel">
            <div id="results" class="results-horizontal-container">
                <!-- Routes and XAI explanations will appear here -->
            </div>
        </div>

        <!-- Report Accident Button & Modal -->
        <button id="openReportModalBtn" class="floating-report-btn primary-btn">Report</button>
        
        <div id="reportModal" class="modal hidden">
            <div class="modal-content glassy">
                <span class="close-btn" id="closeReportModalBtn">&times;</span>
                <h2>Report an Accident</h2>
                <form id="reportForm">
                    <div class="input-group">
                        <label for="reportLocation">Location</label>
                        <div style="display: flex; gap: 10px;">
                            <input type="text" id="reportLocation" placeholder="Location" required style="flex: 1;">
                            <button type="button" class="secondary-btn" id="btnReportLiveLoc" style="width: auto;" title="Use Live Location">⌖</button>
                        </div>
                    </div>
                    <div class="input-group">
                        <label for="reportDesc">Description</label>
                        <input type="text" id="reportDesc" placeholder="Description (e.g. car crash)" required>
                    </div>

                    <div class="input-row">
                        <div class="input-group">
                            <label for="reportSeverity">Severity</label>
                            <select id="reportSeverity">
                                <option value="Low">Low</option>
                                <option value="Medium">Medium</option>
                                <option value="High">High</option>
                            </select>
                        </div>
                        <div class="input-group">
                            <label for="reportTime">Time of Accident</label>
                            <input type="datetime-local" id="reportTime" required>
                        </div>
                    </div>

                    <div class="input-group">
                        <label for="reportImage">Upload Image (Optional)</label>
                        <input type="file" id="reportImage" accept="image/*">
                        <img id="imagePreview" src="" alt="Preview" class="hidden" style="max-height: 150px; border-radius: 8px; margin-top: 10px; object-fit: cover;">
                    </div>

                    <button type="submit" class="primary-btn">Submit Report</button>
                </form>
                <p id="reportMsg" class="msg"></p>
            </div>
        </div>
        
    </div>

<button onclick="predictRisk()">
    Predict Route Risk
</button>

<h2 id="result"></h2>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="script.js"></script>

    <button onclick="predictRisk()">
    Test AI Prediction
</button>
</body>
</html>
